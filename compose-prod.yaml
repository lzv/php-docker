services:

  proxy:
    # Документация по образу: https://hub.docker.com/_/traefik
    image: traefik:v3.7
    restart: unless-stopped
    command: --providers.docker
    ports:
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  server:
    build:
      context: .
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db-app-password
    volumes:
      - public-images:/var/www/html/public_html/images
    environment:
      - PASSWORD_FILE_PATH=/run/secrets/db-app-password
      - DB_HOST=db
      - DB_NAME=app_db
      - DB_USER=app_user
    labels:
      traefik.http.routers.server.rule: Host(`localhost`) || Host(`www.localhost`)
      traefik.http.services.server.loadbalancer.server.port: 80

  db:
    # Документация по образу: https://hub.docker.com/_/mysql
    image: mysql:8
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/mysql
    secrets:
      - db-app-password
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=y
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD_FILE=/run/secrets/db-app-password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  phpmyadmin:
    # Документация по образу: https://hub.docker.com/_/phpmyadmin
    image: phpmyadmin:5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PMA_HOST=db
    labels:
      traefik.http.routers.phpmyadmin.rule: Host(`db.localhost`)
      traefik.http.services.phpmyadmin.loadbalancer.server.port: 80

volumes:
  db-data:
  public-images:

secrets:
  db-app-password:
    file: ./secrets/db-app-pass
